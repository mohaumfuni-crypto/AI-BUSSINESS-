name: phase1b-verification

on:
  push:
    paths:
      - "phase1b/**"
      - ".github/workflows/phase1b-verification.yml"
  pull_request:
    paths:
      - "phase1b/**"
      - ".github/workflows/phase1b-verification.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Phase 1A freeze guard
        run: |
          git diff --exit-code -- phase1a-execution/ \
            || (echo "FROZEN PHASE 1A MODIFIED" && exit 1)

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Phase 1A regression gate
        working-directory: phase1a-execution
        run: python run_phase1a.py

      - name: Phase 1B verifier
        working-directory: phase1b
        env:
          PYTHONPATH: ../phase1a-execution
        run: python run_phase1b.py

      - name: Upload Phase 1B evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase1b-evidence
          path: phase1b/phase1b_evidence.json
